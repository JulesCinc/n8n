services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
         - OLLAMA_DEBUG=2
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  open-webui:
    image: backplane/open-webui:0
    container_name: open-webui
    ports:
      - "80:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama:
  open-webui:
