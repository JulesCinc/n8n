# docker-compose complet de la VM (Ollama + OpenWebUI + n8n + Qdrant).
# Clé API Qdrant : définir QDRANT_API_KEY dans un fichier .env à côté de ce fichier
#   (ex. QDRANT_API_KEY=$(openssl rand -hex 32)).
# Dans n8n : credential "Qdrant API" -> URL http://qdrant:6333 + cette clé ;
#            credential "Ollama"     -> URL http://ollama:11434.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      - OLLAMA_DEBUG=2
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  open-webui:
    image: backplane/open-webui:0
    container_name: open-webui
    ports:
      - "80:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - WEBHOOK_URL=http://10.3.54.88:5678/
      - N8N_PROXY_HOPS=1
      - N8N_SECURE_COOKIE=false   # login en HTTP (labo uniquement)
    volumes:
      - n8n_data:/home/node/.n8n
      - ./vidal_out:/data/vidal:ro   # JSONL Vidal lisible par le workflow d'indexation
    depends_on:
      - ollama
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"   # REST + dashboard, joignable depuis la VM seulement (tunnel SSH)
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  ollama:
    name: chatbot_ollama
    external: true
  open-webui:
    name: chatbot_open-webui
    external:  true
  n8n_data:
    name: n8n_data
    external: true
  qdrant_data:
    name: qdrant_data
    external: true
