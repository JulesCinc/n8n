services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
         - OLLAMA_DEBUG=2
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  open-webui:
    image: backplane/open-webui:0
    container_name: open-webui
    ports:
      - "80:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - WEBHOOK_URL=https://k2vm-136.mde.epf.fr/   # replace with your VM's URL
      - N8N_PROXY_HOPS=1
      - N8N_SECURE_COOKIE=false   # allow login over plain HTTP (lab only)
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  ollama:
  open-webui:
  n8n_data:
    name: n8n_data
